name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, for example v1.0.0"
        required: true
        type: string
      create_github_release:
        description: "Create the GitHub release. Does not publish to npm."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/test.yml

  github-release:
    needs: verify
    if: inputs.create_github_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build, pack, and write an SBOM
        run: |
          npm ci
          npm test
          npm pack
          npm sbom --omit=dev --sbom-format cyclonedx > sbom.cdx.json
          sha256sum iaf-agent-bridge-*.tgz sbom.cdx.json > SHA256SUMS
      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "tag must look like v1.2.3" >&2; exit 1 ;;
          esac
          git rev-parse "refs/tags/$TAG" >/dev/null
          version="${TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## " ver "($| )" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "See CHANGELOG.md." > notes.md
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md iaf-agent-bridge-*.tgz sbom.cdx.json SHA256SUMS
